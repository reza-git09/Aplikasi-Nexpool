name: nexpool
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Untuk mengambil foto dari galeri/kamera
  image_picker: ^1.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.6

  # Untuk membuka URL eksternal (Google Maps / Browser Pembayaran)
  url_launcher: ^6.3.0

  # Pembayaran tampil dalam aplikasi tanpa membuka browser
  webview_flutter: ^4.10.7

  # Peta native yang bisa digeser dan di-zoom pakai jari
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  file_saver: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Untuk mengganti ikon aplikasi (logo tim)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Pengaturan ikon aplikasi.
# Simpan logo tim (PNG persegi, sekitar 1024x1024) di assets/icon/logo.png,
# lalu jalankan:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LOGO_NEXPOOL.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Opsional (ikon adaptif Android). Aktifkan kalau sudah punya logo_foreground.png
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/logo_foreground.png"