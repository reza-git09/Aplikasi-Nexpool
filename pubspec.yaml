name: nexpool
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Untuk mengambil foto dari galeri/kamera
  image_picker: ^1.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.6

  # Untuk membuka URL eksternal (Google Maps / Browser Pembayaran)
  url_launcher: ^6.3.0

  # Pembayaran tampil dalam aplikasi tanpa membuka browser
  webview_flutter: ^4.10.7

  # Peta native yang bisa digeser dan di-zoom pakai jari
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/